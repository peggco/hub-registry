name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
      CDN_BASE: ${{ vars.CDN_BASE || secrets.CDN_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build
      - name: Check publish configuration
        run: |
          missing=0
          for name in R2_BUCKET CLOUDFLARE_ZONE_ID CDN_BASE CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload indexes to R2
        if: env.R2_BUCKET != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for file in skills.json mcp.json plugins.json catalog.json; do
            npx wrangler r2 object put "$R2_BUCKET/$file" \
              --remote \
              --file "dist/$file" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300, s-maxage=300"
          done
      - name: Purge CDN cache
        if: env.CLOUDFLARE_ZONE_ID != '' && env.CDN_BASE != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for file in skills.json mcp.json plugins.json catalog.json; do
            response=$(curl -sS --fail-with-body -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"files\":[\"$CDN_BASE/$file\"]}")
            echo "$response"
            echo "$response" | jq -e '.success == true' > /dev/null
          done
